<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login | Sistema de Gestión de Insumos</title>

	<style>
		/* ===== Reinicio básico ===== */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		/* ===== Colores del sistema (fáciles de cambiar) ===== */
		:root {
			--color-principal: #d9480f;       /* naranja cálido */
			--color-principal-hover: #b83a0a;
			--color-fondo: #fff4ec;
			--color-texto: #2b2b2b;
			--color-borde: #d8d8d8;
			--color-tarjeta: #ffffff;
		}

		/* ===== Fondo y centrado de la pantalla ===== */
		body {
			font-family: "Segoe UI", Tahoma, Arial, sans-serif;
			background: linear-gradient(135deg, #fff4ec 0%, #ffe0cc 100%);
			color: var(--color-texto);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		/* ===== Tarjeta del login ===== */
		.login-card {
			background: var(--color-tarjeta);
			width: 100%;
			max-width: 420px;
			padding: 40px 32px;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
			text-align: center;
		}

		.icono {
			font-size: 3rem;
			margin-bottom: 8px;
		}

		.login-card h1 {
			font-size: 1.8rem;
			line-height: 1.25;
			margin-bottom: 8px;
			color: var(--color-principal);
		}

		.subtitulo {
			font-size: 0.95rem;
			color: #777;
			margin-bottom: 28px;
		}

		/* ===== Campos del formulario ===== */
		.campo {
			text-align: left;
			margin-bottom: 18px;
		}

		.campo label {
			display: block;
			font-weight: 600;
			font-size: 0.9rem;
			margin-bottom: 6px;
		}

		.campo input,
		.campo select {
			width: 100%;
			padding: 12px 14px;
			font-size: 1rem;
			border: 1.5px solid var(--color-borde);
			border-radius: 8px;
			background: #fafafa;
			transition: border-color 0.2s, box-shadow 0.2s;
		}

		/* Efecto al hacer clic dentro de un campo */
		.campo input:focus,
		.campo select:focus {
			outline: none;
			border-color: var(--color-principal);
			box-shadow: 0 0 0 3px rgba(217, 72, 15, 0.18);
			background: #fff;
		}

		/* ===== Botón Ingresar ===== */
		.btn-ingresar {
			width: 100%;
			margin-top: 10px;
			padding: 14px;
			font-size: 1.1rem;
			font-weight: 700;
			color: #fff;
			background: var(--color-principal);
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.2s, transform 0.1s;
		}

		.btn-ingresar:hover {
			background: var(--color-principal-hover);
		}

		.btn-ingresar:active {
			transform: scale(0.98);
		}

		/* ===== Pie de la tarjeta ===== */
		.pie {
			margin-top: 22px;
			font-size: 0.8rem;
			color: #999;
		}

		/* ===== Ajuste para celulares pequeños ===== */
		@media (max-width: 480px) {
			.login-card {
				padding: 30px 20px;
			}
			.login-card h1 {
				font-size: 1.5rem;
			}
		}
	</style>
</head>

<body>

	<main class="login-card">
		<div class="icono">🍽️</div>
		<h1>Sistema de Gestión de Insumos</h1>
		<p class="subtitulo">Inicia sesión para continuar</p>

		<form>
			<div class="campo">
				<label for="rol">Rol</label>
				<select id="rol" name="rol">
					<option value="dueno">Dueño</option>
					<option value="encargado">Encargado</option>
					<option value="empleado">Empleado</option>
				</select>
			</div>

			<div class="campo">
				<label for="usuario">Usuario</label>
				<input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario" autocomplete="username">
			</div>

			<div class="campo">
				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" placeholder="Escribe tu contraseña" autocomplete="current-password">
			</div>

			<button type="submit" class="btn-ingresar">Ingresar</button>
		</form>

		<p class="pie">Uso interno del restaurante</p>
	</main>

</body>
</html>
