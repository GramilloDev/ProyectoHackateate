<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>EcoMenu · Panel del Encargado</title>
<style>
:root{--primary:#1450B8;--primary-d:#0A2A66;--ink:#0F1B3D;--muted:#4A5675;--line:#C9D3EA;--bg:#F3F6FC;--card:#FFFFFF;
--bad:#9B1C1C;--bad-bg:#FDE8E8;--warn:#7A4A00;--warn-bg:#FFF1D6;--ok:#0B5C33;--ok-bg:#E3F5EA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{color-scheme:light}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}

/* 2 columnas 50/50 */
.screen{height:100%;display:grid;grid-template-columns:1fr 1fr;position:relative}
.col{min-height:0;display:flex;flex-direction:column;padding:3vh 3vw}

/* Columna izquierda */
.left{background:linear-gradient(160deg,#FFFFFF 0%,#E8EFFB 100%);border-right:1px solid var(--line);gap:2.5vh}
.logo{height:clamp(70px,17vh,150px);align-self:flex-start;object-fit:contain;mix-blend-mode:multiply}
h1{margin:0;font-size:clamp(22px,3.8vh,32px);color:var(--primary-d);letter-spacing:-.01em}
.sub{margin:.4vh 0 0;color:var(--muted);font-size:clamp(13px,1.9vh,16px)}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,3vh,28px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vh,18px);box-shadow:0 2px 10px rgba(20,80,184,.08)}
.full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input,select{width:100%;height:clamp(40px,5.8vh,48px);padding:0 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
input:focus,select:focus{outline:3px solid #9DBBF0;border-color:var(--primary)}
.btn{grid-column:1/-1;height:clamp(44px,6.2vh,52px);border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--primary-d)}
.btn:focus-visible{outline:3px solid #9DBBF0;outline-offset:2px}
.msg{grid-column:1/-1;min-height:20px;margin:0;font-size:14px;font-weight:600;color:var(--bad)}
.msg.ok{color:var(--ok)}

/* Columna derecha */
.right{background:var(--card);gap:1.8vh;padding-bottom:calc(3vh + clamp(34px,7vh,60px))}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.tablebox{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:clamp(14px,2vh,16px)}
thead th{position:sticky;top:0;z-index:1;background:var(--primary-d);color:#fff;text-align:left;padding:12px 14px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
tbody td{padding:12px 14px;border-bottom:1px solid #E4EAF6}
tbody tr.bad{background:var(--bad-bg)}
tbody tr.warn{background:var(--warn-bg)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.badge.bad{background:var(--bad);color:#fff}
.badge.warn{background:var(--warn);color:#fff}
.badge.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* BuenaMesa discreto, esquina inferior derecha */
.bm{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:clamp(34px,7vh,60px);width:auto;opacity:.9;mix-blend-mode:multiply;pointer-events:none}

@media (max-width:800px){
.screen{grid-template-columns:1fr 1fr}
.col{padding:2vh 2vw}
form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="screen">

  <!-- IZQUIERDA: registro -->
  <section class="col left">
    <img class="logo" src="ecomenu.jpg" alt="EcoMenu">
    <div>
      <h1>Panel del Encargado</h1>
      <p class="sub">Registra los productos que entran al inventario.</p>
    </div>
    <form id="f" novalidate>
      <div class="full">
        <label for="prod">Producto</label>
        <input id="prod" type="text" placeholder="Ej. Tomate saladette">
      </div>
      <div>
        <label for="cant">Cantidad</label>
        <input id="cant" type="number" min="0" step="any" placeholder="0">
      </div>
      <div>
        <label for="uni">Unidad</label>
        <select id="uni">
          <option>kg</option><option>g</option><option>L</option>
          <option>ml</option><option>pza</option><option>caja</option>
        </select>
      </div>
      <div class="full">
        <label for="cad">Fecha de caducidad</label>
        <input id="cad" type="date">
      </div>
      <p class="msg" id="m" role="alert"></p>
      <button class="btn" type="submit">Guardar</button>
    </form>
  </section>

  <!-- DERECHA: inventario -->
  <section class="col right">
    <div class="head">
      <div>
        <h1>Inventario actual</h1>
        <p class="sub" id="resumen"></p>
      </div>
      <div class="legend">
        <span class="badge bad">Caducado</span>
        <span class="badge warn">Caduca en 3 días o menos</span>
        <span class="badge ok">Vigente</span>
      </div>
    </div>
    <div class="tablebox">
      <table>
        <thead>
          <tr><th>Producto</th><th>Cantidad</th><th>Caducidad</th><th>Estado</th></tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </section>

  <img class="bm" src="buenamesa.jpg" alt="BuenaMesa">
</main>

<script>
var inv=[],tb=document.getElementById('tb'),res=document.getElementById('resumen'),
f=document.getElementById('f'),m=document.getElementById('m');

function iso(off){var d=new Date();d.setDate(d.getDate()+off);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dias(s){var a=s.split('-'),d=new Date(a[0],a[1]-1,a[2]),n=new Date();n.setHours(0,0,0,0);
  return Math.round((d-n)/864e5);}
function fmt(s){var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0];}
function td(txt){var c=document.createElement('td');c.textContent=txt;return c;}

function render(){
  inv.sort(function(a,b){return a.cad<b.cad?-1:1;});
  tb.innerHTML='';var alertas=0;
  if(!inv.length){var r=document.createElement('tr'),c=document.createElement('td');
    c.colSpan=4;c.className='empty';c.textContent='Sin productos registrados.';r.appendChild(c);tb.appendChild(r);}
  inv.forEach(function(p){
    var d=dias(p.cad),cls,txt;
    if(d<0){cls='bad';txt='Caducado hace '+(-d)+(d===-1?' día':' días');}
    else if(d===0){cls='warn';txt='Caduca hoy';}
    else if(d<=3){cls='warn';txt='Caduca en '+d+(d===1?' día':' días');}
    else{cls='ok';txt='Vigente';}
    if(cls!=='ok')alertas++;
    var tr=document.createElement('tr');if(cls!=='ok')tr.className=cls;
    tr.appendChild(td(p.nom));tr.appendChild(td(p.cant+' '+p.uni));tr.appendChild(td(fmt(p.cad)));
    var e=document.createElement('td'),b=document.createElement('span');
    b.className='badge '+cls;b.textContent=txt;e.appendChild(b);tr.appendChild(e);tb.appendChild(tr);
  });
  res.textContent=inv.length+' productos · '+alertas+' con alerta';
}

f.addEventListener('submit',function(e){
  e.preventDefault();m.className='msg';
  var nom=document.getElementById('prod').value.trim(),
      cant=document.getElementById('cant').value,
      uni=document.getElementById('uni').value,
      cad=document.getElementById('cad').value;
  if(!nom||!cant||Number(cant)<=0||!cad){m.textContent='Completa todos los campos con valores válidos.';return;}
  inv.push({nom:nom,cant:cant,uni:uni,cad:cad});
  render();f.reset();m.className='msg ok';m.textContent='Producto guardado.';
});

/* Datos de ejemplo (bórralos al conectar tu backend) */
[['Leche entera',6,'L',-1],['Pechuga de pollo',4,'kg',2],['Crema',3,'L',3],
 ['Tomate saladette',8,'kg',5],['Queso Oaxaca',2,'kg',9],['Lechuga romana',12,'pza',4],
 ['Arroz',25,'kg',180],['Frijol negro',20,'kg',240],['Aceite vegetal',10,'L',200],
 ['Huevo',15,'caja',12],['Zanahoria',6,'kg',8],['Tortilla de maíz',10,'kg',0]
].forEach(function(x){inv.push({nom:x[0],cant:x[1],uni:x[2],cad:iso(x[3])});});
render();
</script>
</body>
</html>
